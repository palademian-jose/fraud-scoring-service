[project]
name = "fraud-scoring-service"
version = "0.1.0"
description = "Card-fraud scoring service: time-ordered split, PR-AUC, cost-weighted threshold, SHAP reason codes, drift monitoring, model card and a /score API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "palademian-jose" }]
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "lightgbm>=4.7",
    "llm-evalops",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shap>=0.46",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
fraudscore = "fraudscore.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.2", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/fraudscore/*" = ["N803", "N806"]
"scripts/*" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.uv.sources]
llm-evalops = { path = "../llm-evalops", editable = true }

[tool.uv.build-backend]
module-name = "fraudscore"
